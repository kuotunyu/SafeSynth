  intervention_basis: >-
    v20 failed its preregistered numeric precision gate with 29 false
    positives. Frozen evidence shows 17 semantic false positives, nine
    empty-GT false positives, three localization errors, and seven misses.
    False positives are concentrated in cells 34 and 13 and in three empty-GT
    cells. v21 therefore reveals the v20 audit GT for development, doubles the
    empty-image weight, replays every v20 false-positive image at weight 36,
    and replays every v20 miss image at weight 32. Training receives two
    additional epochs. The threshold grid, geometry, architecture, and gates
    remain fixed; only a fresh independent audit may decide acceptance.
