schema_version: 1
experiment_id: "supervised_labeler_v9"
status: "cpu_preflight_passed_gpu_smoke_pending"
architecture: "rtdetr_v2_r101vd_helmet_only"
split_seed: 20260829
training_seed: 20260809
split_manifest_sha256: "6e5a806bab1265cc71d09efcf6dfac0d699db6c74d81e7e71423913b1498ff59"

model:
  repo_id: "PekingU/rtdetr_v2_r101vd"
  revision: "2c5dbbd2d4d8c8814827a3b42737ba1afce3cf2a"
  license: "apache-2.0"
  transformers_version: "5.14.1"
  required_download_bytes: 307337786
  allow_files:
    config.json: 5342
    model.safetensors: 307332000
    preprocessor_config.json: 444
  local_files_only: true
  image_size: 640

data:
  source_split: "train_only"
  category: "helmet"
  category_id_after_remap: 0
  prior_consumed_sets_become_calibration: true
  prior_history_terminal_experiment: "supervised_labeler_v8"
  new_untouched_audit_images: 48
  exclude_complete_source_groups_from_training: true
  validation_images_read: 0
  test_images_read: 0

sampling:
  strategy: "deterministic_weighted_replacement"
  epoch_samples: "training_image_count"
  empty_image_weight: 2.0
  close_helmet_pair_weight: 2.0
  close_pair_center_distance_over_mean_sqrt_area_max: 1.0
  small_helmet_weight: 2.0
  small_helmet_relative_area_max: 0.0075
  overlap_policy: "maximum_weight"
  selection_basis: >-
    Freeze the v8 sampling policy. The v9 experiment changes model capacity
    only, so sampling cannot be adjusted after seeing v8 review failures.

optimization:
  epochs: 12
  train_batch_size: 8
  eval_batch_size: 8
  learning_rate: 0.0001
  backbone_lr_multiplier: 0.1
  weight_decay: 0.0001
  warmup_steps: 500
  max_grad_norm: 0.1
  precision: "bf16"
  dataloader_num_workers: 0
  checkpoint_selection: "best_calibration_f1_at_precision_floor"
  initialization: "pinned_base_checkpoint_only"
  seed_selection_basis: "reuse the stable v1/v3/v6/v7/v8 training seed"

postprocessing:
  max_relative_area: 0.14
  max_relative_height: 0.40
  min_aspect_ratio: 0.25
  max_aspect_ratio: 4.0
  selection_basis: >-
    Freeze the v8 geometry policy. The v8 owner failures include a high-score
    false positive and a no-localization miss, so geometry relaxation alone
    cannot repair the observed failure set.

calibration:
  score_thresholds:
    - 0.015
    - 0.018
    - 0.019
    - 0.020
    - 0.021
    - 0.022
    - 0.023
    - 0.024
    - 0.025
    - 0.026
    - 0.027
    - 0.028
    - 0.030
    - 0.035
    - 0.040
    - 0.050
  match_iou: 0.50
  min_precision: 0.82
  precision_margin_basis: >-
    Freeze the v8 calibration grid and precision floor. On revealed v8
    evidence, threshold 0.083 was required to remove the highest-score owner
    false positive and reduced recall to 0.0847, so post-hoc threshold repair
    is forbidden.

audit_gate:
  min_precision: 0.80
  min_recall: 0.70
  min_median_matched_iou: 0.60
  single_final_read: true

human_review_gate:
  required_after_numeric_pass: true
  reviewer: "kuotunyu"
  approve_only_if_problem_count: 0
  exact_box_sidecar_required: true
  separated_panels:
    - "dataset_gt_green"
    - "model_magenta"
    - "overlay"
  reject_categories:
    - "background_false_positive"
    - "missed_helmet"
    - "merged_multiple_helmets"
    - "other_visual_failure"

diagnostic_evidence:
  owner_review:
    source: "reports/supervised_labeler_v8_human_review.json"
    file_sha256: "45ba11717b571bb2e596b296107e002b3cb60a3a92d40f77ad8b7aceec23c033"
    evidence_sha256: "c1f32644f4d2e1f7f8b9e8d9e85820c2b3995d82b52600ce60548893ba5f3f2c"
    problem_cells:
      - 1
      - 6
      - 10
      - 16
      - 41
      - 42
  failure_diagnosis:
    source: "reports/supervised_labeler_v8_review_diagnosis.json"
    file_sha256: "0a4a240669e418cb34b807607a8ab38c770a232880620cf055c099e4476dcd83"
    owner_false_positive_boxes: 4
    below_score_threshold_instances: 3
    no_matching_localization_instances: 2
    threshold_and_geometry_blocked_instances: 1
    highest_owner_false_positive_score: 0.08251953125
    recall_at_threshold_0_083: 0.08465608465608465
  eligible_for_v9_gate: false

model_change:
  from_repo_id: "PekingU/rtdetr_v2_r50vd"
  to_repo_id: "PekingU/rtdetr_v2_r101vd"
  selection_basis: >-
    The revealed v8 failures span class discrimination, confidence, and box
    localization. A scalar score or geometry change cannot repair them
    jointly. Increase backbone capacity from R50 to R101 as the only
    model-facing v9 change and preserve every other training and gate rule.

generation_gate:
  allowed: false
  reason: >-
    v9 is only preregistered. Its new Train-only audit is still sealed and
    whole-image generation remains forbidden.
