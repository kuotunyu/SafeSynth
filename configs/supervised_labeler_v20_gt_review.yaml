  intervention_basis: >-
    v19 passed its numeric audit but failed the zero-problem owner visual gate.
    Frozen evidence confirms seven unmatched worn helmeted heads across five
    cells and five semantic false positives across two empty-GT cells. v20
    therefore reveals the approved v19 audit GT for development, applies
    stronger exact positive replay to all five miss images, and applies
    stronger exact hard-negative replay to both false-positive images. The
    calibration floor and geometry remain fixed so the new independent audit,
    not post-audit threshold editing, decides acceptance.
  held_constant:
    architecture: "rtdetr_v2_r101vd_helmet_only"
    training_seed: 20260809
    empty_image_weight: 6.0
    positive_error_replay_weight: 12.0
