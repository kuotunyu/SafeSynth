# Numeric source of truth for M3/M4 near-duplicate grouping.
# The chosen values are recorded in the frozen split manifest after visual review.

phash:
  hash_size: 8
  spike_thresholds: [4, 6, 8, 10]

clip:
  # H3 enables CLIP only when pHash alone leaves more than this many groups.
  trigger_group_count: 2000
  model_name: "ViT-B-32"
  pretrained: "laion2b_s34b_b79k"
  batch_size: 128
  cosine_threshold_candidates: [0.85, 0.90, 0.95, 0.975]
  phash_guard_candidates: [12, 16, 20]

guardrails:
  max_group_size: 250
  split_tolerance: 0.02
  simulation_seeds: [42, 43, 44, 45, 46]

runtime:
  phash_workers: 8

visuals:
  h1_sample_size: 40
  h1_context_fraction: 0.50
  contact_sheet_columns: 8
  contact_sheet_cell_size: 144
  clip_group_rows: 20
  clip_group_columns: 8
  clip_group_cell_size: 128
  placement_bins: 16
