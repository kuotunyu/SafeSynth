    The v17 numeric audit passed but the owner found two missed worn helmeted
    heads and three visual false-positive images. The exact miss images receive
    stronger positive replay, and the exact false-positive images join the
    hard-negative replay set before any v18 pool pixels are read. Cell 31
    exposed four predictions whose raw rectangles extended materially outside
    the image while passing all v17 size and aspect limits. v18 therefore drops
    a prediction when more than 10 percent of its raw box area lies outside the
    image. The fresh v18 audit alone decides acceptance.
  held_constant:
    architecture: "rtdetr_v2_r101vd_helmet_only"
    training_seed: 20260809
    close_helmet_pair_weight: 2.0
    small_helmet_weight: 2.0
    large_helmet_weight: 6.0
    near_image_edge_helmet_weight: 4.0
    max_relative_area: 0.70
