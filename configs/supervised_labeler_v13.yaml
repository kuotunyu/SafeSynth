    min_texture_std: 5.0

sampling:
  strategy: "deterministic_weighted_replacement"
  epoch_samples: "training_image_count"
  empty_image_weight: 4.0
  close_helmet_pair_weight: 2.0
  close_pair_center_distance_over_mean_sqrt_area_max: 1.0
  small_helmet_weight: 2.0
  small_helmet_relative_area_max: 0.0075
  large_helmet_weight: 3.0
  large_helmet_relative_area_min: 0.15
  overlap_policy: "maximum_weight"
  selection_basis: >-
    Preregistered before v13 pool pixels or training. Empty-image weighting
    addresses v12 background false positives; large-helmet weighting addresses
    the two v12 large worn-helmet misses. Close/small weights remain v11.

optimization:
  epochs: 12
  train_batch_size: 8
  eval_batch_size: 8
  learning_rate: 0.0001
  backbone_lr_multiplier: 0.1
  weight_decay: 0.0001
  warmup_steps: 500
  max_grad_norm: 0.1
  precision: "bf16"
  dataloader_num_workers: 0
  checkpoint_selection: "best_calibration_f1_at_precision_floor"
  initialization: "pinned_base_checkpoint_only"
  seed_selection_basis: "reuse_v11_training_seed"

postprocessing:
  max_relative_area: 0.30
  max_relative_height: 0.75
  min_aspect_ratio: 0.20
  max_aspect_ratio: 4.0
  selection_basis: >-
    Preregistered before v13 pool pixels or training to retain the correctly
    localized large worn-helmet candidates diagnosed in v12.

