# Single source of truth for every NUMERIC threshold of the quality filter.
# docs/filtering_spec.md defines the predicates (FILT-01..) and contains NO
# numbers, so the spec and the values can never drift apart.
#
# `source` tags: fixed | guess | calibrated  (see configs/compose.yaml header)
# Milestone M6 (calibration harness) rewrites every `calibrated` field.
#
# M12 produces a threshold-sensitivity table: each threshold is perturbed by
# +/-20% independently and the acceptance rate recomputed. If one threshold's
# +/-20% swings acceptance by more than `sensitivity_alarm_points` percentage
# points, that threshold is carrying the whole filter and must be calibrated
# properly rather than guessed.
sensitivity_alarm_points: 15                 # source: guess

rules:

  # FILT-01 — bounding boxes must lie inside the frame
  bbox_in_bounds:
    min_box_side_px: 4                       # source: fixed
    min_inside_ratio: 0.60                   # source: guess   (measured BEFORE clipping)

  # FILT-02 — a labelled object must be big enough to be a real target
  min_visible_area:
    min_area_px: 36                          # source: calibrated  (target: p1 of real box area)

  # FILT-03 — enough of the object must actually be visible
  visible_fraction:
    helmet: 0.30                             # source: guess
    head:   0.30                             # source: guess
    person: 0.25                             # source: guess

  # FILT-04 — objects must not be stacked on top of each other
  # overlap_score uses IoMin, not IoU: IoU badly under-reports "small box wholly
  # inside a big box", which is exactly the geometry of a helmet swallowed by a
  # person box, or a duplicate paste landing on an existing object.
  overlap:
    max_overlap_score_same_class: 0.80       # source: calibrated  (p99)
    max_overlap_iou_same_class: 0.75         # source: calibrated  (p99)
    exempt_person_contains_helmet_head: true # source: fixed   (that containment is correct, not an error)

  # FILT-05 — the mask must plausibly fill its box
  mask_to_box_coverage:
    helmet: [0.40, 0.95]                     # source: calibrated  (p1-p99)
    head:   [0.45, 0.95]                     # source: calibrated
    person: [0.22, 0.90]                     # source: calibrated

  # FILT-07 — a WORN helmet must sit in a plausible range above a head.
  # All quantities are normalized by the head box:
  #   dx        = (helmet.cx - head.cx) / head.w
  #   dy        = (head.y0  - helmet.cy) / head.h     (+ = helmet centre ABOVE head top)
  #   overlap_y = (helmet.y1 - head.y0)  / head.h     (how far the helmet BOTTOM dips in)
  #   r_w, r_h  = helmet.w / head.w , helmet.h / head.h
  #
  # overlap_y_min IS the contact test: below it the helmet does not physically
  # touch the head, i.e. a FLOATING HELMET.
  #
  # CAVEAT: if spike H1 shows helmet and head are mutually exclusive per person
  # (the ~2x area ratio strongly suggests this), there are NO real (head, helmet)
  # pairs to calibrate against. In that case calibrate against person-box-relative
  # positions instead, and record in the report that this rule governs only
  # synthesized worn-helmet compositions and mirrors no real-data pattern.
  helmet_above_head:
    k_x: 0.35                                # source: guess   |dx| <= k_x
    dy_min: -0.10                            # source: guess   sitting slightly low over the brow
    dy_max: 0.75                             # source: guess   up to 0.75 head-heights above
    overlap_y_min: 0.15                      # source: guess   <- the contact test
    overlap_y_max: 0.75                      # source: guess   above this the helmet swallows the face
    r_w: [0.75, 1.60]                        # source: guess
    r_h: [0.25, 1.10]                        # source: guess
    min_iou_helmet_head: 0.05                # source: guess   (robust to odd aspect ratios)

  # FILT-08 — Person / Head / Helmet size ratios.
  # Applies when a helmet/head box is contained in a person box.
  # Seeded from anthropometry (head ~1/7 of body height => area ratio 0.02-0.06),
  # but the upper bounds are deliberately wide because construction-scene person
  # boxes are frequently torso-up crops. 751 real person instances is enough to
  # compute honest percentiles — do that instead of trusting these priors.
  size_ratio:
    containment_threshold: 0.70              # source: guess   (when to consider it "inside")
    head_over_person_area: [0.01, 0.25]      # source: calibrated
    helmet_over_person_area: [0.01, 0.30]    # source: calibrated
    head_over_person_width: [0.15, 0.85]     # source: calibrated
    head_top_within_person: 0.45             # source: guess   (head must be in the upper 45%)

  # FILT-09 — clipping / intersection artifacts
  clipping_artifact:
    # Depth-inconsistent poke-through: genuine occlusion is either substantial or
    # zero. A SMALL mutual intersection while the paste is BEHIND the other object
    # means it is poking out where it geometrically cannot.
    poke_through_range: [0.02, 0.20]         # source: guess
    # Seam energy: mean |grad| in a 2 px band just inside the paste boundary,
    # divided by mean |grad| over the paste interior.
    # Calibrate by measuring the SAME statistic at REAL object boundaries in the
    # dataset and taking p95 — that gives the natural distribution.
    max_seam_energy_ratio: 2.5               # source: calibrated
    seam_band_px: 2                          # source: fixed

  # FILT-10 — hard negatives must not corrupt a real label
  hard_negative_no_overlap:
    max_iou_with_annotation: 0.02            # source: fixed

  # FILT-11 — near-duplicate rejection
  phash_dedup:
    hash_size: 8                             # source: fixed   (64-bit)
    max_hamming_to_accepted_synthetic: 6     # source: fixed   (standard near-dup threshold)
    max_hamming_to_any_real_image: 6         # source: fixed   (checked against ALL splits)
    # "Nothing happened" guard: every paste was tiny or fully occluded.
    min_changed_pixel_ratio: 0.005           # source: guess

# ===========================================================================
# Reject reasons. rules.py must emit only these strings.
# ===========================================================================
reject_reasons:
  - OUT_OF_BOUNDS
  - BOX_TOO_SMALL
  - LOW_VISIBLE_FRACTION
  - EXCESSIVE_OVERLAP
  - BAD_MASK_COVERAGE
  - FLOATING_HELMET
  - HELMET_HEAD_MISALIGNED
  - HELMET_SWALLOWS_HEAD
  - BAD_SIZE_RATIO
  - CLIPPING_ARTIFACT
  - SEAM_ARTIFACT
  - HARD_NEGATIVE_OVERLAPS_ANNOTATION
  - NEAR_DUPLICATE_SYNTHETIC
  - NEAR_DUPLICATE_REAL
  - NO_CHANGE
  - SAM2_MASK_REJECTED
  - PLACEMENT_RETRIES_EXHAUSTED

# ===========================================================================
# These are ASSERTIONS, not filters. A violation is a bug in compose.py, so the
# run must crash rather than quietly drop the sample — otherwise the bug hides
# inside the rejection statistics.
# ===========================================================================
assertions:
  real_annotation_count_invariant: true      # n_out == n_in - len(intentional_removals)
  z_order_matches_y_bottom: true
  no_zero_area_annotation: true
  test_blocklist_untouched: true             # every generation script calls this at startup

# ===========================================================================
# Preview grids (PREV-01..) for human spot-checking.
# ===========================================================================
preview:
  grid_rows: 4                               # source: guess
  grid_cols: 4                               # source: guess
  draw_boxes: true                           # source: fixed
  annotate_scores: true                      # source: fixed
  # Hard-negative previews are drawn WITHOUT boxes, with a caption saying that
  # this is correct by construction (they carry no annotation on purpose).
  hard_negative_draw_boxes: false            # source: fixed
  # Accepted-vs-rejected comparison grid. If a REJECTED sample looks fine to the
  # eye, the threshold is wrong: change it and log the change in docs/decisions.md.
  accepted_vs_rejected_n: 12                 # source: guess
  # Cutout contact sheets are composited on MAGENTA so alpha errors (background
  # bleed, halos) are impossible to miss.
  cutout_backdrop_rgb: [255, 0, 255]         # source: fixed
