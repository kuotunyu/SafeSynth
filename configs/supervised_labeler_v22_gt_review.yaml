    - "splits/supervised_labeler_v18_gt_pool.json"
    - "splits/supervised_labeler_v19_gt_pool.json"
    - "splits/supervised_labeler_v20_gt_pool.json"
    - "splits/supervised_labeler_v21_gt_pool.json"
  exclude_every_prior_primary_and_reserve_group: true
  required_future_model_initialization: "pinned_base_checkpoint_only"
  required_future_training_exclusion: >-
    Every v22 primary and sealed-reserve source group must be excluded from
    both v22 training and calibration before the pinned base checkpoint opens.
  validation_images_read: 0
  test_images_read: 0

candidate_pool:
  primary_images: 64
  sealed_reserve_images: 32
  primary_quotas:
    positive_area_q1: 12
    positive_area_q2: 12
    positive_area_q3: 12
    positive_area_q4: 12
    dataset_gt_empty: 16
  sealed_reserve_quotas:
    positive_area_q1: 6
    positive_area_q2: 6
    positive_area_q3: 6
    positive_area_q4: 6
    dataset_gt_empty: 8
  representative_policy: "one_deterministically_ranked_image_per_source_group"
  positive_stratification: "quartiles_of_median_relative_helmet_gt_area"
  empty_group_policy: "every_Train_image_in_group_has_zero_helmet_gt"

final_audit_target:
  images: 48
  quotas:
    positive_area_q1: 10
    positive_area_q2: 10
    positive_area_q3: 10
    positive_area_q4: 10
    dataset_gt_empty: 8
  selection_policy: >-
    Accept the first valid GT-only cases in each frozen stratum order.
    Quarantine any DATASET_GT_DEFECT, AMBIGUOUS, or UNCERTAIN image. Use valid
    primary surplus before opening a same-stratum sealed reserve.

input_normalization:
  method: "reflected_padding_normalize_cover_crop"
  implementation: "src.synthetic.compose.normalize_reflected_padding"
  output_shape: "source_native"
  transform_helmet_annotations: true
  guard:
    action: "normalize_cover_crop"
    min_pad_px: 8
    max_pad_fraction: 0.31
    orthogonal_sample_size: 64
    max_pair_mae: 3.0
    min_pair_correlation: 0.97
    min_texture_std: 5.0

review_stage:
  name: "gt_only"
  reviewer: "kuotunyu"
  model_boxes_allowed: false
  instruction: >-
    Review green dataset boxes only. Report a cell if a worn helmeted head is
    missing, a green box covers a non-worn object/background, multiple wearers
    are merged into one box, localization is unusable, or either boxing choice
    would be equally defensible.
  categories:
    - "PASS"
    - "DATASET_GT_FALSE_POSITIVE"
    - "DATASET_GT_MISS"
    - "DATASET_GT_LOCALIZATION"
    - "AMBIGUOUS"
    - "UNCERTAIN"

