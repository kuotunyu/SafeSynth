schema_version: 1
experiment_id: "supervised_labeler_v22_gt_review"
status: "gt_only_pool_frozen_before_pixel_review"
source_split: "Train"
split_seed: 20260806

protocol:
  path: "docs/human_review_protocol.md"
  label_semantics: "class_direct_helmeted_head_region"
  positive: >-
    One green box per visible person wearing a safety hard hat. The box includes
    the hard hat plus the wearer's head or visible part of the face.
  negative: >-
    An unworn or isolated hard hat, logo, background, ordinary face, bare head,
    or other helmet-like object receives no green box.
  border_policy: >-
    A partly visible helmeted head touching an image edge is positive only when
    enough of the hard hat and wearer remain identifiable for a meaningful box.
    Ambiguous edge fragments are not forced into the audit.
  uncertain_policy: "quarantine_complete_image"

