  category: "helmet"
  category_id_after_remap: 0
  prior_consumed_sets_become_calibration: true
  prior_history_terminal_experiment: "supervised_labeler_v10"
  new_untouched_audit_images: 48
  exclude_complete_source_groups_from_training: true
  quarantined_gt_defect_image_ids:
    - 3060
    - 4155
    - 4364
  quarantine_policy: >-
    Keep the owner-confirmed GT defects out of calibration metrics while
    retaining their complete source groups outside training and the new audit.
  validation_images_read: 0
  test_images_read: 0

input_normalization:
  method: "reflected_padding_normalize_cover_crop"
  implementation: "src.synthetic.compose.normalize_reflected_padding"
  output_shape: "source_native"
  transform_helmet_annotations: true
  selection_basis: >-
    Freeze the v10 reflected-padding normalization. v11 changes only the
    postprocessing geometry policy and quarantines known GT defects.
  guard:
    action: "normalize_cover_crop"
    min_pad_px: 8
    max_pad_fraction: 0.31
    orthogonal_sample_size: 64
    max_pair_mae: 3.0
    min_pair_correlation: 0.97
    min_texture_std: 5.0

sampling:
  strategy: "deterministic_weighted_replacement"
  epoch_samples: "training_image_count"
  empty_image_weight: 2.0
  close_helmet_pair_weight: 2.0
  close_pair_center_distance_over_mean_sqrt_area_max: 1.0
  small_helmet_weight: 2.0
  small_helmet_relative_area_max: 0.0075
  overlap_policy: "maximum_weight"
  selection_basis: >-
    Freeze the v10 sampling policy so v11 has one model-facing change.

optimization:
  epochs: 12
  train_batch_size: 8
  eval_batch_size: 8
  learning_rate: 0.0001
  backbone_lr_multiplier: 0.1
  weight_decay: 0.0001
  warmup_steps: 500
  max_grad_norm: 0.1
  precision: "bf16"
  dataloader_num_workers: 0
  checkpoint_selection: "best_calibration_f1_at_precision_floor"
  initialization: "pinned_base_checkpoint_only"
  seed_selection_basis: "reuse the stable v1/v3/v6-v10 training seed"

postprocessing:
  max_relative_area: 0.15
  max_relative_height: 0.60
  min_aspect_ratio: 0.20
  max_aspect_ratio: 4.0
  selection_basis: >-
    The preregistered edge_large_060 candidate is the smallest revealed-history
    geometry expansion that recovers all four v10 boxes removed by geometry and
    remains within 0.003 F1 of the best tested candidate after GT quarantine.

calibration:
  score_thresholds:
    - 0.015
    - 0.018
    - 0.019
    - 0.020
    - 0.021
    - 0.022
    - 0.023
    - 0.024
    - 0.025
