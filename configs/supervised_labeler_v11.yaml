  precision: "bf16"
  dataloader_num_workers: 0
  checkpoint_selection: "best_calibration_f1_at_precision_floor"
  initialization: "pinned_base_checkpoint_only"
  seed_selection_basis: "reuse the stable v1/v3/v6-v10 training seed"

