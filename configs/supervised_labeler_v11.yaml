    - 0.040
    - 0.050
  match_iou: 0.50
  min_precision: 0.82
  precision_margin_basis: >-
    Freeze the v10 score grid and precision floor.

audit_gate:
  min_precision: 0.80
  min_recall: 0.70
  min_median_matched_iou: 0.60
  single_final_read: true

human_review_gate:
  required_after_numeric_pass: true
  reviewer: "kuotunyu"
  approve_only_if_problem_count: 0
  exact_box_sidecar_required: true
  separated_panels:
    - "dataset_gt_green"
    - "model_magenta"
    - "overlay"
  reject_categories:
    - "background_false_positive"
    - "missed_helmet"
    - "merged_multiple_helmets"
    - "other_visual_failure"

