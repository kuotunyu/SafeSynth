  close_helmet_pair_weight: 2.0
  close_pair_center_distance_over_mean_sqrt_area_max: 1.0
  small_helmet_weight: 2.0
  small_helmet_relative_area_max: 0.0075
  overlap_policy: "maximum_weight"
  selection_basis: >-
    Freeze the v10 sampling policy so v11 has one model-facing change.

