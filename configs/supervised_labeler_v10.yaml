  eligible_for_v10_gate: false

model_change:
  from: "raw_source_pixels_and_boxes"
  to: "reflection_normalized_source_pixels_and_transformed_boxes"
  selection_basis: >-
    The v9 owner failures all share reflected padding. Normalize detected
    mirrored borders before both training and evaluation, transform helmet
    boxes through the identical crop-resize mapping, and preserve the R101
    model plus every optimizer, sampler, calibration, geometry, and gate rule.

