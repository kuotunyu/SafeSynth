  formal_training_and_calibration_estimate_minutes: [20, 30]
  final_independent_audit_estimate_minutes: [1, 3]
  recommended_contiguous_gpu_window_minutes: 35

generation_gate:
  allowed: false
  reason: >-
    The v19 intervention is preregistered, but its fresh GT-only pool has not
    yet been frozen or reviewed. Split freeze, CPU preflight, GPU smoke,
    base-only training, independent numeric audit, and a separate zero-problem
    owner model review are all still required.
