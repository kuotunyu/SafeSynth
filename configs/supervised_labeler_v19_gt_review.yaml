    its outside fraction was only 0.00249, so a tighter outside-area rule would
    not address the failure. v19 instead adds exact image 4618 to stronger
    replay and raises the calibration precision floor from 0.86 to 0.90. The
    fresh v19 audit alone decides acceptance.
