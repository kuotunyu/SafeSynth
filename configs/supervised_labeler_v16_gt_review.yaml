  evidence_path: "reports/supervised_labeler_v16_gt_review.json"
  evidence_file_sha256: "7359efe45b0fa5562726f4e6674aa967fb5f781948b281ef07bd0ccdea0aa322"
  evidence_sha256: "97dfe79247d15aea1348ddda42d40acf9a7a14eb05fd6897d25d0f2bbd91fbe6"
  primary_images_read: 64
