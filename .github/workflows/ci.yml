# PUB-10: lint and the full test suite on every push and pull request.
#
# WHY windows-latest AND NOT ubuntu-latest. This project is Windows-native by
# decision (ADR-002), and the test suite encodes that. The clearest
# case is tests/test_paths.py, which asserts that the configured data root
# "D:/bulk" resolves unchanged: PureWindowsPath("D:/bulk").is_absolute() is
# True, PurePosixPath("D:/bulk").is_absolute() is False, so on Linux the loader
# would treat the drive letter as a relative directory and glue it onto the
# project root. Running CI on Linux would report a failure that says nothing
# about the code.
#
# WHAT THIS JOB DELIBERATELY DOES NOT NEED. No GPU: every test fakes torch.cuda
# rather than touching it, and no test calls from_pretrained. No network model
# download. No D:\sdg-data drive: the bulk data and historical checkpoints live
# outside the repository. Unit tests isolate those boundaries with tmp_path;
# evidence tests verify every repository-contained field before explicitly
# skipping only an unavailable external checkpoint hash. Other intentional skips
# cover scripts without a __main__ guard and optional evaluation dependencies.
#
# THE README VERIFIER IS A GATE. scripts/verify_readme.py compares every number
# in a README results table against results/detection_metrics.csv, which IS now
# tracked - .gitignore carries an explicit exception for it precisely so that a
# fresh clone can run this check. EVAL-12 makes that file the thing every
# reported number is measured against, so a README claim with no source in it
# should fail the build rather than be noticed later by a reader.
#
# The script exits 3 for "nothing to verify yet" when the CSV is absent. That is
# deliberately NOT treated as success below: a run that verified nothing must
# not look like a run that verified everything.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The workspace on a Windows runner sits on the small D: drive, and the
      # cu130 torch wheel plus its CUDA payload does not fit there next to a uv
      # cache. Both the cache and the virtual environment go on C:, and
      # UV_LINK_MODE=copy because uv cannot hardlink across volumes.
      UV_CACHE_DIR: C:\uv-cache
      UV_PROJECT_ENVIRONMENT: C:\safesynth-venv
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"

      # --locked fails rather than re-resolving, so a pyproject.toml change that
      # was never locked cannot slip through as a silently different dependency
      # set. uv.lock is committed; see PUB-10.
      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Verify curated figure evidence
        run: uv run python scripts/verify_figure_evidence.py --expected-state curated

      # PUB-01: no number reaches the README without a source in results/.
      - name: Verify the README against results/
        run: uv run python -m scripts.verify_readme

# ADR-005: importing an AGPL-3.0 detector would make the
      # importing file a derivative work and break the MIT licence. The scanner
      # exits non-zero on a hit and is proved in both directions by
      # tests/test_forbidden_licences.py.
      - name: Scan for forbidden licences
        run: uv run python -m scripts.check_forbidden_licences
